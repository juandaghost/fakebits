  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)" />
  <polygon points="64,22 104,50 64,108 24,50" fill="#ffffff" />
  <polygon points="64,22 84,50 64,66 44,50" fill="#d1fae5" />
  <polygon points="24,50 64,66 64,108" fill="#a7f3d0" />
  <polygon points="104,50 64,66 64,108" fill="#ecfdf5" />
