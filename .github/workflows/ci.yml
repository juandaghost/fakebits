name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Firefox build plus Mozilla's linter (fails on errors, not on warnings).
      - run: pnpm --filter @fakebits/extension lint:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-mv3
          path: apps/extension/.output/chrome-mv3
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-mv2
          path: apps/extension/.output/firefox-mv2

  e2e:
    # Loads the built extension in Playwright's Chromium against a stubbed twitch.tv page.
    # The live twitch.tv smoke test (FAKEBITS_LIVE=1) is not run here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fakebits/extension exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/extension/playwright-report
            apps/extension/test-results
